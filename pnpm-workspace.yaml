packages:
  - web/*
  - packages/*

# One version of each shared dependency for every workspace package (see docs/VERSIONS.md).
catalog:
  react: 19.3.1
  react-dom: 19.3.1
  tailwindcss: 4.3.5
  typescript: 5.9.3
  '@types/node': 24.19.2
  '@types/react': 19.3.0
  '@types/react-dom': 19.3.0
# Next 16.4.6 pins postcss 8.5.23, below our floor (docs/VERSIONS.md). Force the pinned one everywhere.
overrides:
  postcss: 8.5.32
