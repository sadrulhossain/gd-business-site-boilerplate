# Production stack. Not a profile of the dev file: the dev stack bind-mounts source and runs dev servers, this one runs
# built images only. Use it with its own env file:
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build --wait
# Published ports: 80 and 443 (nginx) only. MariaDB has no published port; there is no Redis, no Mailpit, no dev server.
name: ${COMPOSE_PROJECT_NAME:-gdsite}

x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

x-php: &php
  image: ${COMPOSE_PROJECT_NAME:-gdsite}-php:${PHP_VERSION}
  restart: always
  init: true
  logging: *logging
  environment: &php-env
    - APP_NAME=${APP_NAME:-My Business}
    - APP_ENV=production
    - APP_DEBUG=false
    - APP_KEY=${APP_KEY:?set APP_KEY}
    - APP_URL=https://api.${APP_DOMAIN:?set APP_DOMAIN}
    - APP_DOMAIN=${APP_DOMAIN}
    - LOCALE_DEFAULT=${LOCALE_DEFAULT:-en}
    - LOCALE_FALLBACK=${LOCALE_FALLBACK:-en}
    - LOCALE_SUPPORTED=${LOCALE_SUPPORTED:-en}
    - LOG_CHANNEL=stderr
    - LOG_LEVEL=${LOG_LEVEL:-warning}
    - CACHE_STORE=database
    - SESSION_DRIVER=database
    - SESSION_SECURE_COOKIE=true
    - QUEUE_CONNECTION=database
    - DB_CONNECTION=mariadb
    - DB_HOST=mariadb
    - DB_PORT=3306
    - DB_DATABASE=${MARIADB_DATABASE}
    - DB_USERNAME=${MARIADB_USER}
    - DB_PASSWORD=${MARIADB_PASSWORD:?set MARIADB_PASSWORD}
    - MAIL_MAILER=${MAIL_MAILER:-smtp}
    - MAIL_HOST=${MAIL_HOST:-}
    - MAIL_PORT=${MAIL_PORT:-587}
    - MAIL_SCHEME=${MAIL_SCHEME:-}
    - MAIL_USERNAME=${MAIL_USERNAME:-}
    - MAIL_PASSWORD=${MAIL_PASSWORD:-}
    - MAIL_FROM_ADDRESS=${MAIL_FROM_ADDRESS:-no-reply@${APP_DOMAIN}}
    - MAIL_FROM_NAME=${APP_NAME:-My Business}
    - UPLOADS_CONTAINER_PATH=${UPLOADS_CONTAINER_PATH}
    - UPLOADS_MAX_MB=${UPLOADS_MAX_MB:-5}
    - PORTAL_REVALIDATE_URL=http://portal:3000/api/revalidate
    - PORTAL_REVALIDATE_SECRET=${PORTAL_REVALIDATE_SECRET:?set PORTAL_REVALIDATE_SECRET}
    - CONTACT_NOTIFY_TO=${CONTACT_NOTIFY_TO:-}
    - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-}
    - SUPERADMIN_NAME=${SUPERADMIN_NAME:-Super Admin}
    - SUPERADMIN_EMAIL=${SUPERADMIN_EMAIL:?set SUPERADMIN_EMAIL}
    - SUPERADMIN_PASSWORD=${SUPERADMIN_PASSWORD:?set SUPERADMIN_PASSWORD}
    - OAUTH_ADMIN_CLIENT_ID=${OAUTH_ADMIN_CLIENT_ID}
    - OAUTH_ADMIN_REDIRECT_URI=https://admin.${APP_DOMAIN}/auth/callback
  volumes:
    - api-storage:/var/www/api/storage
    - uploads-data:${UPLOADS_CONTAINER_PATH}

services:
  mariadb:
    image: mariadb:${MARIADB_VERSION}
    container_name: ${COMPOSE_PROJECT_NAME:-gdsite}-mariadb
    restart: always
    logging: *logging
    # No `ports:` on purpose: only containers on this compose network can reach the database.
    environment:
      - MARIADB_DATABASE=${MARIADB_DATABASE}
      - MARIADB_USER=${MARIADB_USER}
      - MARIADB_PASSWORD=${MARIADB_PASSWORD:?set MARIADB_PASSWORD}
      - MARIADB_ROOT_PASSWORD=${MARIADB_ROOT_PASSWORD:?set MARIADB_ROOT_PASSWORD}
      - MARIADB_AUTO_UPGRADE=1
    volumes:
      - mariadb-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  php:
    <<: *php
    container_name: ${COMPOSE_PROJECT_NAME:-gdsite}-php
    # The one php service that builds the image; the queue worker and the scheduler reuse it.
    build:
      context: .
      dockerfile: docker/prod/php.Dockerfile
      args:
        PHP_VERSION: ${PHP_VERSION}
        COMPOSER_VERSION: ${COMPOSER_VERSION}
        UPLOADS_CONTAINER_PATH: ${UPLOADS_CONTAINER_PATH}
    command: ["php-start.sh"]
    healthcheck:
      test: ["CMD-SHELL", "pidof php-fpm >/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 60s
    depends_on:
      mariadb: { condition: service_healthy }

  php-queue:
    <<: *php
    container_name: ${COMPOSE_PROJECT_NAME:-gdsite}-php-queue
    user: www-data
    command: ["php", "artisan", "queue:work", "--sleep=3", "--tries=3", "--max-time=3600"]
    healthcheck:
      test: ["CMD-SHELL", "pidof php >/dev/null"]
      interval: 30s
      timeout: 3s
      retries: 3
    depends_on:
      php: { condition: service_healthy }

  php-scheduler:
    <<: *php
    container_name: ${COMPOSE_PROJECT_NAME:-gdsite}-php-scheduler
    user: www-data
    command: ["php", "artisan", "schedule:work"]
    healthcheck:
      test: ["CMD-SHELL", "pidof php >/dev/null"]
      interval: 30s
      timeout: 3s
      retries: 3
    depends_on:
      php: { condition: service_healthy }

  # Next.js as a Node server. Builds the site on first start (see docker/prod/portal.Dockerfile), hence the long start_period.
  portal:
    image: ${COMPOSE_PROJECT_NAME:-gdsite}-portal:${NODE_VERSION}
    build:
      context: .
      dockerfile: docker/prod/portal.Dockerfile
      args:
        NODE_VERSION: ${NODE_VERSION}
        IMAGE_ID: ${IMAGE_ID:-local}
    container_name: ${COMPOSE_PROJECT_NAME:-gdsite}-portal
    restart: always
    init: true
    logging: *logging
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
      - LOCALE_DEFAULT=${LOCALE_DEFAULT:-en}
      - LOCALE_SUPPORTED=${LOCALE_SUPPORTED:-en}
      # Server-side API reads use the internal, TLS-free listener of nginx.
      - API_INTERNAL_URL=http://nginx:8080/api
      - SITE_URL=https://${APP_DOMAIN}
      - PORTAL_REVALIDATE_SECRET=${PORTAL_REVALIDATE_SECRET:?set PORTAL_REVALIDATE_SECRET}
    volumes:
      - portal-next:/app/web/portal/.next
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 600s
    depends_on:
      nginx: { condition: service_healthy }

  nginx:
    image: ${COMPOSE_PROJECT_NAME:-gdsite}-nginx:${NGINX_VERSION}
    build:
      context: .
      dockerfile: docker/prod/nginx.Dockerfile
      args:
        NODE_VERSION: ${NODE_VERSION}
        NGINX_VERSION: ${NGINX_VERSION}
        OAUTH_ADMIN_CLIENT_ID: ${OAUTH_ADMIN_CLIENT_ID}
    container_name: ${COMPOSE_PROJECT_NAME:-gdsite}-nginx
    restart: always
    logging: *logging
    environment:
      - APP_DOMAIN=${APP_DOMAIN}
      - UPLOADS_CONTAINER_PATH=${UPLOADS_CONTAINER_PATH}
      - UPLOADS_MAX_MB=${UPLOADS_MAX_MB:-5}
      - TRUSTED_PROXY_CIDR=${TRUSTED_PROXY_CIDR:-172.16.0.0/12}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      # fullchain.pem and privkey.pem, valid for APP_DOMAIN, admin.APP_DOMAIN and api.APP_DOMAIN
      - ${TLS_CERT_DIR:?set TLS_CERT_DIR}:/etc/nginx/certs:ro
      - uploads-data:${UPLOADS_CONTAINER_PATH}:ro
    healthcheck:
      # Goes through nginx -> php-fpm -> database, so it fails when any of the three is down.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      php: { condition: service_healthy }

volumes:
  mariadb-data:
  api-storage:
  uploads-data:
  portal-next:
