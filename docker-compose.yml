# Dev stack. Every service lists its own environment; no env_file.
x-php: &php
  image: ${COMPOSE_PROJECT_NAME}-php:${PHP_VERSION}
  build:
    context: ./docker/php
    args:
      PHP_VERSION: ${PHP_VERSION}
      COMPOSER_VERSION: ${COMPOSER_VERSION}
      UPLOADS_CONTAINER_PATH: ${UPLOADS_CONTAINER_PATH}
  restart: unless-stopped
  working_dir: /var/www/api
  volumes:
    - ./api:/var/www/api
    - ./docker/php/dev.ini:/usr/local/etc/php/conf.d/zz-dev.ini:ro
    - uploads-data:${UPLOADS_CONTAINER_PATH}
  environment: &php-env
    - APP_ENV=${APP_ENV}
    - APP_DEBUG=${APP_DEBUG}
    - APP_KEY=${APP_KEY}
    - APP_URL=http://api.${APP_DOMAIN}:${NGINX_HTTP_PORT}
    - APP_DOMAIN=${APP_DOMAIN}
    - LOCALE_DEFAULT=${LOCALE_DEFAULT}
    - LOCALE_FALLBACK=${LOCALE_FALLBACK}
    - LOCALE_SUPPORTED=${LOCALE_SUPPORTED}
    - LOG_CHANNEL=stderr
    - CACHE_STORE=database
    - SESSION_DRIVER=database
    - QUEUE_CONNECTION=database
    - DB_CONNECTION=mariadb
    - DB_HOST=mariadb
    - DB_PORT=3306
    - DB_DATABASE=${MARIADB_DATABASE}
    - DB_USERNAME=${MARIADB_USER}
    - DB_PASSWORD=${MARIADB_PASSWORD}
    - MAIL_HOST=mailpit
    - MAIL_PORT=1025
    - UPLOADS_CONTAINER_PATH=${UPLOADS_CONTAINER_PATH}
    - UPLOADS_MAX_MB=${UPLOADS_MAX_MB}
    - PORTAL_REVALIDATE_URL=${PORTAL_REVALIDATE_URL:-}
    - PORTAL_REVALIDATE_SECRET=${PORTAL_REVALIDATE_SECRET:-}
    - CONTACT_NOTIFY_TO=${CONTACT_NOTIFY_TO:-}

services:
  php:
    <<: *php
    container_name: ${COMPOSE_PROJECT_NAME}-php
    command: ["fpm-start.sh"]
    healthcheck:
      test: ["CMD-SHELL", "pidof php-fpm >/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 5
    depends_on:
      mariadb: { condition: service_healthy }

  php-queue:
    <<: *php
    container_name: ${COMPOSE_PROJECT_NAME}-php-queue
    user: www-data
    command: ["artisan-or-idle.sh", "queue:work", "--sleep=3", "--tries=3"]
    depends_on:
      mariadb: { condition: service_healthy }

  php-scheduler:
    <<: *php
    container_name: ${COMPOSE_PROJECT_NAME}-php-scheduler
    user: www-data
    command: ["artisan-or-idle.sh", "schedule:work"]
    depends_on:
      mariadb: { condition: service_healthy }

  node:
    image: node:${NODE_VERSION}-alpine
    container_name: ${COMPOSE_PROJECT_NAME}-node
    restart: unless-stopped
    working_dir: /app
    command: ["sh", "/app/docker/node/dev.sh"]
    environment:
      - NODE_ENV=development
      - WATCHPACK_POLLING=true
      - NEXT_TELEMETRY_DISABLED=1
      - COREPACK_ENABLE_DOWNLOAD_PROMPT=0
      - PNPM_STORE_DIR=/app/node_modules/.pnpm-store
      - APP_DOMAIN=${APP_DOMAIN}
      - NGINX_HTTP_PORT=${NGINX_HTTP_PORT}
      - PORTAL_DEV_PORT=${PORTAL_DEV_PORT}
      - ADMIN_DEV_PORT=${ADMIN_DEV_PORT}
      - OAUTH_ADMIN_CLIENT_ID=${OAUTH_ADMIN_CLIENT_ID}
      # Portal server-side API calls go through nginx (api.<domain> is an alias of the nginx service on the compose network).
      - API_INTERNAL_URL=${API_INTERNAL_URL:-http://api.${APP_DOMAIN}/api}
      - LOCALE_DEFAULT=${LOCALE_DEFAULT}
      - LOCALE_SUPPORTED=${LOCALE_SUPPORTED}
      - PORTAL_REVALIDATE_SECRET=${PORTAL_REVALIDATE_SECRET:-}
      - SITE_URL=${SITE_URL:-http://${APP_DOMAIN}:${NGINX_HTTP_PORT}}
      - PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1
    volumes:
      - .:/app
      - root-node-modules:/app/node_modules
      - admin-node-modules:/app/web/admin/node_modules
      - portal-node-modules:/app/web/portal/node_modules
      - api-types-node-modules:/app/packages/api-types/node_modules
      - api-client-node-modules:/app/packages/api-client/node_modules
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:$$ADMIN_DEV_PORT/ && wget -q -O /dev/null http://127.0.0.1:$$PORTAL_DEV_PORT/"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 120s

  # Browser tests (make e2e). Not started by `make up`; same code and node_modules as the node service.
  e2e:
    image: mcr.microsoft.com/playwright:v1.65.0-noble
    profiles: ["e2e"]
    working_dir: /app/web/admin
    environment:
      - E2E_ADMIN_ORIGIN=http://admin.${APP_DOMAIN}:${NGINX_HTTP_PORT}
      - E2E_EMAIL=${E2E_EMAIL:-}
      - E2E_PASSWORD=${E2E_PASSWORD:-}
    volumes:
      - .:/app
      - root-node-modules:/app/node_modules
      - admin-node-modules:/app/web/admin/node_modules
      - portal-node-modules:/app/web/portal/node_modules
      - api-types-node-modules:/app/packages/api-types/node_modules
      - api-client-node-modules:/app/packages/api-client/node_modules

  nginx:
    image: nginx:${NGINX_VERSION}-alpine
    container_name: ${COMPOSE_PROJECT_NAME}-nginx
    restart: unless-stopped
    environment:
      - APP_DOMAIN=${APP_DOMAIN}
      - PORTAL_DEV_PORT=${PORTAL_DEV_PORT}
      - ADMIN_DEV_PORT=${ADMIN_DEV_PORT}
      - UPLOADS_CONTAINER_PATH=${UPLOADS_CONTAINER_PATH}
      - UPLOADS_MAX_MB=${UPLOADS_MAX_MB}
      - TRUSTED_PROXY_CIDR=${TRUSTED_PROXY_CIDR:-172.16.0.0/12}
    networks:
      default:
        aliases:
          - api.${APP_DOMAIN}
    ports:
      - "${NGINX_HTTP_PORT}:80"
    volumes:
      - ./docker/nginx/templates:/etc/nginx/templates:ro
      - ./docker/nginx/snippets:/etc/nginx/snippets:ro
      - ./api:/var/www/api:ro
      - uploads-data:${UPLOADS_CONTAINER_PATH}:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
    depends_on:
      - php
      - node

  mariadb:
    image: mariadb:${MARIADB_VERSION}
    container_name: ${COMPOSE_PROJECT_NAME}-mariadb
    restart: unless-stopped
    environment:
      - MARIADB_DATABASE=${MARIADB_DATABASE}
      - MARIADB_USER=${MARIADB_USER}
      - MARIADB_PASSWORD=${MARIADB_PASSWORD}
      - MARIADB_ROOT_PASSWORD=${MARIADB_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:${MARIADB_PORT}:3306"
    volumes:
      - mariadb-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit:${MAILPIT_VERSION}
    container_name: ${COMPOSE_PROJECT_NAME}-mailpit
    profiles: [dev]
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_PORT}:1025"
      - "127.0.0.1:${MAILPIT_UI_PORT}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  mariadb-data:
  root-node-modules:
  admin-node-modules:
  portal-node-modules:
  api-types-node-modules:
  api-client-node-modules:
  uploads-data:
