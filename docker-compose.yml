# Dev stack. Every service lists its own environment; no env_file.
x-php: &php
  image: ${COMPOSE_PROJECT_NAME}-php:${PHP_VERSION}
  build:
    context: ./docker/php
    args:
      PHP_VERSION: ${PHP_VERSION}
      COMPOSER_VERSION: ${COMPOSER_VERSION}
      PHPREDIS_VERSION: ${PHPREDIS_VERSION}
  restart: unless-stopped
  working_dir: /var/www/api
  volumes:
    - ./api:/var/www/api
  environment: &php-env
    - APP_ENV=${APP_ENV}
    - APP_DEBUG=${APP_DEBUG}
    - APP_KEY=${APP_KEY}
    - APP_URL=http://api.${APP_DOMAIN}:${NGINX_HTTP_PORT}
    - APP_DOMAIN=${APP_DOMAIN}
    - LOCALE_DEFAULT=${LOCALE_DEFAULT}
    - LOCALE_FALLBACK=${LOCALE_FALLBACK}
    - LOCALE_SUPPORTED=${LOCALE_SUPPORTED}
    - LOG_CHANNEL=stderr
    - CACHE_STORE=redis
    - SESSION_DRIVER=redis
    - QUEUE_CONNECTION=redis
    - REDIS_CLIENT=phpredis
    - DB_CONNECTION=pgsql
    - DB_HOST=postgres
    - DB_PORT=5432
    - DB_DATABASE=${POSTGRES_DB}
    - DB_USERNAME=${POSTGRES_USER}
    - DB_PASSWORD=${POSTGRES_PASSWORD}
    - REDIS_HOST=redis
    - REDIS_PORT=6379
    - REDIS_USERNAME=${REDIS_USER}
    - REDIS_PASSWORD=${REDIS_PASSWORD}
    - MAIL_HOST=mailpit
    - MAIL_PORT=1025

services:
  php:
    <<: *php
    container_name: ${COMPOSE_PROJECT_NAME}-php
    command: ["fpm-start.sh"]
    healthcheck:
      test: ["CMD-SHELL", "pidof php-fpm >/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 5
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  php-queue:
    <<: *php
    container_name: ${COMPOSE_PROJECT_NAME}-php-queue
    command: ["artisan-or-idle.sh", "queue:work", "--sleep=3", "--tries=3"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  php-scheduler:
    <<: *php
    container_name: ${COMPOSE_PROJECT_NAME}-php-scheduler
    command: ["artisan-or-idle.sh", "schedule:work"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  node:
    image: node:${NODE_VERSION}-alpine
    container_name: ${COMPOSE_PROJECT_NAME}-node
    restart: unless-stopped
    working_dir: /app
    command: ["sh", "/app/docker/node/dev.sh"]
    environment:
      - NODE_ENV=development
      - WATCHPACK_POLLING=true
      - NEXT_TELEMETRY_DISABLED=1
      - APP_DOMAIN=${APP_DOMAIN}
      - NGINX_HTTP_PORT=${NGINX_HTTP_PORT}
      - PORTAL_DEV_PORT=${PORTAL_DEV_PORT}
      - ADMIN_DEV_PORT=${ADMIN_DEV_PORT}
    volumes:
      - ./web:/app/web
      - ./docker/node:/app/docker/node:ro
      - admin-node-modules:/app/web/admin/node_modules
      - portal-node-modules:/app/web/portal/node_modules
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:$$ADMIN_DEV_PORT/ && wget -q -O /dev/null http://127.0.0.1:$$PORTAL_DEV_PORT/"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 120s

  nginx:
    image: nginx:${NGINX_VERSION}-alpine
    container_name: ${COMPOSE_PROJECT_NAME}-nginx
    restart: unless-stopped
    environment:
      - APP_DOMAIN=${APP_DOMAIN}
      - PORTAL_DEV_PORT=${PORTAL_DEV_PORT}
      - ADMIN_DEV_PORT=${ADMIN_DEV_PORT}
    ports:
      - "${NGINX_HTTP_PORT}:80"
    volumes:
      - ./docker/nginx/templates:/etc/nginx/templates:ro
      - ./api:/var/www/api:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
    depends_on:
      - php
      - node

  postgres:
    image: postgres:${POSTGRES_VERSION}-alpine
    container_name: ${COMPOSE_PROJECT_NAME}-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:${POSTGRES_PORT}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:${REDIS_VERSION}-alpine
    container_name: ${COMPOSE_PROJECT_NAME}-redis
    restart: unless-stopped
    entrypoint: ["sh", "/docker/redis-entrypoint.sh"]
    environment:
      - REDIS_USER=${REDIS_USER}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    ports:
      - "127.0.0.1:${REDIS_PORT}:6379"
    volumes:
      - redis-data:/data
      - ./docker/redis/entrypoint.sh:/docker/redis-entrypoint.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli --user \"$$REDIS_USER\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:${MAILPIT_VERSION}
    container_name: ${COMPOSE_PROJECT_NAME}-mailpit
    profiles: [dev]
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_PORT}:1025"
      - "127.0.0.1:${MAILPIT_UI_PORT}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  postgres-data:
  redis-data:
  admin-node-modules:
  portal-node-modules:
