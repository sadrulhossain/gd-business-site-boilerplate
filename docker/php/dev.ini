; Dev stack only (mounted by docker-compose.yml, not baked into the image or used in production).
; The api/ bind mount on Windows makes every file stat ~6 ms, so PHP must not re-check files on each request.
; Trade-off: a PHP edit can take up to 30 s to show. Run `docker compose restart php` to see it at once.
opcache.validate_timestamps = 1
opcache.revalidate_freq = 30
opcache.max_accelerated_files = 20000
opcache.memory_consumption = 192
realpath_cache_size = 4096K
realpath_cache_ttl = 600
