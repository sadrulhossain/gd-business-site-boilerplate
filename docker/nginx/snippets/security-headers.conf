# Included in every server block (add_header is not inherited once a block sets its own, so locations include it again).
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
# Browsers ignore HSTS over plain http, so this is inert in dev and active behind TLS in production.
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
